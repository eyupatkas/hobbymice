## hobbymice.com.tr — Transformice web client + static assets
## Mevcut IP-bazlı transformice config'e dokunmadan ayrı domain config

# HTTP → HTTPS yönlendirme
server {
    listen 80;
    listen [::]:80;
    server_name hobbymice.com.tr;

    # ACME challenge (certbot renewal)
    location /.well-known/acme-challenge/ {
        root /root/projects/transformice/web-client/dist;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — ana site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hobbymice.com.tr;

    ssl_certificate     /etc/letsencrypt/live/hobbymice.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hobbymice.com.tr/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Web client static files (Vite build output)
    root /root/projects/transformice/web-client/dist;
    index index.html;

    # Panel + API → Express server (port 3080)
    location ^~ /panel/ {
        proxy_pass http://127.0.0.1:3080/panel/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — bilinmeyen route'ları index.html'e yönlendir
    location / {
        try_files $uri $uri/ /index.html;
        # HTML cache'leme — her zaman taze çek
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }
    }

    # Oyun indirme (Hobby-Mice.zip)
    location = /dl/Hobby-Mice.zip {
        alias /root/projects/transformice/web-client/dist/dl/Hobby-Mice.zip;
        add_header Content-Disposition 'attachment; filename="Hobby-Mice.zip"';
        add_header Content-Type "application/zip";
        add_header Cache-Control "public, max-age=3600";
    }

    # SWF dosyası (Ruffle veya Flash player ile yüklenecek)
    location ^~ /transformice/ {
        alias /root/projects/transformice/web-client/dist/transformice/;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
    }

    # Game static assets (images, audio, etc.) — Flash client asset server ile aynı
    # x_connexion: daha spesifik prefix önce tanımlanmalı (^~ en uzun prefix kazanır)
    location ^~ /images/x_transformice/x_connexion/ {
        alias /root/projects/transformice/server/static_assets/images/x_transformice/x_connexion/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400";
        index index.swf;
        try_files $uri $uri/index.swf =404;
    }

    location ^~ /images/ {
        alias /root/projects/transformice/server/static_assets/images/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400";
    }

    # Language files
    location ^~ /langues/ {
        alias /root/projects/transformice/server/static_assets/langues/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
    }

    # Transformice audio/resources (musique, son, etc.)
    location ^~ /transformice/musique/ {
        alias /root/projects/transformice/server/static_assets/transformice/musique/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400";
    }

    location ^~ /transformice/son/ {
        alias /root/projects/transformice/server/static_assets/transformice/son/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400";
    }

    # SWF ses dosyaları: /son/xxx.mp3 → static_assets/transformice/son/xxx.mp3
    location ^~ /son/ {
        alias /root/projects/transformice/server/static_assets/transformice/son/;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* \.mp3$ {
        root /root/projects/transformice/server/static_assets;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
    }

    # Flash crossdomain policy
    location = /crossdomain.xml {
        add_header Content-Type text/xml;
        return 200 '<cross-domain-policy><allow-access-from domain="*"/></cross-domain-policy>';
    }

    # Cihaz doğrulama endpoint — /verify-device → verify_device.py (port 8082)
    location = /verify-device {
        proxy_pass http://127.0.0.1:8082/verify-device;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # WebSocket proxy — wss://hobbymice.com.tr/ws → localhost:11901
    location /ws {
        proxy_pass http://127.0.0.1:11901/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Panel Chat WebSocket proxy — wss://hobbymice.com.tr/panel-ws → Express (port 3080)
    location /panel-ws {
        proxy_pass http://127.0.0.1:3080/panel-ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Ruffle WebSocket-to-TCP proxy — wss://hobbymice.com.tr/ruffle-ws → Express (port 3080)
    location /ruffle-ws {
        proxy_pass http://127.0.0.1:3080/ruffle-ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # WASM MIME type for Ruffle
    location ^~ /ruffle/ {
        try_files $uri =404;
        types {
            application/wasm wasm;
            application/javascript js;
        }
    }

    # Static assets cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
}
