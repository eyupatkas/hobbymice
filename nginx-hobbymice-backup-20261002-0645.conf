## hobbymice.com.tr — HobbyMice web sitesi + tarayıcıda oyun + kaynak aynası

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name hobbymice.com.tr www.hobbymice.com.tr;

    location /.well-known/acme-challenge/ {
        root /var/www/hobbymice;
    }

    # Kaynak aynasi: Flash istemci (projector) http ile istekte bulunabilir
    location ^~ /res/ {
        include /etc/nginx/snippets/hobbymice-res-proxy.conf;
    }

    # Flash policy http uzerinden de servis edilmeli (301 policy'yi bozar)
    location = /crossdomain.xml {
        add_header Content-Type text/xml;
        return 200 '<cross-domain-policy><allow-access-from domain="*" /></cross-domain-policy>';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hobbymice.com.tr www.hobbymice.com.tr;

    ssl_certificate     /etc/letsencrypt/live/hobbymice.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hobbymice.com.tr/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/hobbymice;
    index index.html;

    # ---- Oyun kaynaklari aynasi (atelier801 CDN -> bizim cache) ----
    location ^~ /res/ {
        include /etc/nginx/snippets/hobbymice-res-proxy.conf;
    }

    # ---- Ruffle WebSocket <-> TCP koprusu ----
    location /ws/ {
        proxy_pass http://127.0.0.1:11901/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---- Indirme paketi ----
    # no-cache: her indirmede tarayici sunucuya danisir (zip guncelse yenisini alir)
    location = /dl/Hobby-Mice.zip {
        alias /var/www/hobbymice/dl/Hobby-Mice.zip;
        add_header Content-Disposition 'attachment; filename="Hobby-Mice.zip"';
        add_header Content-Type "application/zip";
        add_header Cache-Control "no-cache";
    }

    # Surumlu dosya adi: /dl/HobbyMice-v<SURUM>.zip -> her zaman guncel zip,
    # tarayiciya kaydedilen isimde surum numarasi gorunur
    location ~ ^/dl/HobbyMice-v(?<zipver>\d+)\.zip$ {
        alias /var/www/hobbymice/dl/Hobby-Mice.zip;
        add_header Content-Disposition 'attachment; filename="HobbyMice-v$zipver.zip"';
        add_header Content-Type "application/zip";
        add_header Cache-Control "no-cache";
    }

    # Surum manifestosu — asla cache'lenmez
    location = /dl/version.json {
        alias /var/www/hobbymice/dl/version.json;
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/json";
    }

    # ---- Ruffle wasm/js ----
    location /ruffle/ {
        types {
            application/wasm wasm;
            application/javascript js;
        }
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ---- Flash crossdomain policy (projector istemcileri icin) ----
    # NOT: to-ports YALNIZCA soket policy'sinde gecerlidir; HTTP policy'sinde
    # kullanilursa policy gecersiz olur ve URLLoader (langues) engellenir.
    location = /crossdomain.xml {
        add_header Content-Type text/xml;
        return 200 '<cross-domain-policy><allow-access-from domain="*" /></cross-domain-policy>';
    }

    # ---- Site ----
    location ~* \.(png|jpg|ico|svg|css|woff2)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Oyun istemcisi — tarayici cache'lenir (2MB'yi her seferinde indirmesin)
    location = /play/TFM.swf {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /play {
        return 301 /play/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;
}
